<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пʼятниця 5×5</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<style id="css">
@import url("https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap");
/* Layout: scoreboard strip on top, season chips + tabs, one working panel below; phone-first single column */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#15213A; --muted:#5D6A80; --line:#D6DDE7;
  --yel:#E2AA12; --yel-ink:#6B4E00; --yel-soft:#FBF0CC;
  --blu:#2F72D0; --blu-ink:#123E7A; --blu-soft:#DCE8FA;
  --win:#21915A; --loss:#CF4239; --draw:#98A2B2;
  --btn:#15213A; --btn-ink:#FFFFFF;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#162036; --sunk:#111A2C; --ink:#E7ECF4; --muted:#93A0B6; --line:#26324B;
  --yel:#F0C238; --yel-ink:#F6D879; --yel-soft:#3A3014;
  --blu:#5F9BEE; --blu-ink:#A9C8F7; --blu-soft:#172A4C;
  --win:#3FBF7F; --loss:#F06A60; --draw:#6E7A8E;
  --btn:#E7ECF4; --btn-ink:#0E1524; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#162036; --sunk:#111A2C; --ink:#E7ECF4; --muted:#93A0B6; --line:#26324B;
  --yel:#F0C238; --yel-ink:#F6D879; --yel-soft:#3A3014;
  --blu:#5F9BEE; --blu-ink:#A9C8F7; --blu-soft:#172A4C;
  --win:#3FBF7F; --loss:#F06A60; --draw:#6E7A8E;
  --btn:#E7ECF4; --btn-ink:#0E1524; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;line-height:1;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand .dot{display:inline-flex;width:22px;height:22px;border-radius:50%;background:linear-gradient(90deg,var(--yel) 50%,var(--blu) 50%)}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;background:var(--btn);color:var(--btn-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--loss);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* scoreboard */
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.side{display:flex;flex-direction:column;gap:2px}
.side.b{align-items:flex-end;text-align:right}
.side .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.side.y .lbl{color:var(--yel-ink)} .side.b .lbl{color:var(--blu-ink)}
.side .big{font-family:var(--f-display);font-size:52px;font-weight:600;line-height:1}
.side.y .big{color:var(--yel)} .side.b .big{color:var(--blu)}
.mid{text-align:center;color:var(--muted);font-size:13px}
.mid b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:500}
.bar{grid-column:1/-1;display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.facts b{color:var(--ink);font-weight:600}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 0}
.panel.pad{padding:16px}
.h{font-family:var(--f-display);font-weight:500;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* rating table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
th.on{color:var(--ink)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:16px;text-align:left;color:var(--muted);width:28px}
th:nth-child(2),td:nth-child(2){text-align:left}
th:last-child,td:last-child{padding-right:16px}
td.name{font-weight:600;position:sticky;left:0}
tr.p{cursor:pointer}
tr.p:hover td{background:var(--sunk)}
tr.low td{color:var(--muted)}
tr.low td.name{font-weight:500}
tr.sep td{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:6px 16px}
.pct{display:inline-flex;align-items:center;gap:6px}
.pct i{display:inline-block;width:38px;height:5px;border-radius:9px;background:var(--sunk);position:relative;overflow:hidden}
.pct i s{position:absolute;inset:0 auto 0 0;background:var(--win);text-decoration:none}
.form{display:inline-flex;gap:3px}
.form span{width:9px;height:9px;border-radius:50%;display:inline-block}
.w{background:var(--win)} .l{background:var(--loss)} .d{background:var(--draw)}
.pos{color:var(--win)} .neg{color:var(--loss)}
tr.det td{background:var(--sunk);white-space:normal;text-align:left;color:var(--ink);padding:14px 16px}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.det-grid h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mate{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:2px 0}
.mate span:last-child{color:var(--muted)}
.months{display:flex;gap:4px;align-items:flex-end;height:54px}
.months div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted)}
.months i{display:block;width:100%;max-width:18px;background:var(--blu);border-radius:3px 3px 0 0;min-height:2px}
.seq{display:flex;gap:3px;flex-wrap:wrap}
.seq span{width:14px;height:14px;border-radius:3px}

.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 24px;padding:4px 16px 12px}
.pair{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pair b{font-weight:600}

/* matches */
.match{display:grid;grid-template-columns:64px 1fr auto 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match .date{font-size:13px;color:var(--muted);line-height:1.2}
.match .date b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);font-weight:500}
.team{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.team.b{justify-content:flex-end}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:500}
.team.y .tag{background:var(--yel-soft);color:var(--yel-ink)}
.team.b .tag{background:var(--blu-soft);color:var(--blu-ink)}
.score{font-family:var(--f-display);font-size:26px;font-weight:600;white-space:nowrap;text-align:center;min-width:84px}
.score .ys{color:var(--yel)} .score .bs{color:var(--blu)} .score .lose{opacity:.45}
.score small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}
.edit{background:none;border:0;color:var(--muted);font-size:13px;padding:4px}
.wx p{margin:0}
.wx-h{font-weight:600}
.wx-d{font-size:14px}
.wx-m{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px;align-items:baseline}
.wx-n{font-weight:600;color:var(--muted);font-size:12px}
.wx-warn{font-weight:600;color:var(--loss)}
.wxline{font-size:14px;font-weight:500}
.match .plan{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;min-width:0}
.plan p{margin:0}
.plan .who{font-size:14px;overflow-wrap:anywhere}
.plan-act{justify-content:flex-start;flex-wrap:wrap;gap:6px}
.hint10{font-size:13px;font-weight:600;color:var(--win)}
.xgame{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--loss);text-transform:uppercase;letter-spacing:.04em}
.match.off .team{opacity:.55}
@media (max-width:640px){
  .match{grid-template-columns:1fr auto;grid-template-areas:"date edit" "y y" "score score" "b b"}
  .match .date{grid-area:date;display:flex;gap:8px;align-items:baseline}
  .match .date b{display:inline}
  .match .edit{grid-area:edit}
  .team.y{grid-area:y} .team.b{grid-area:b;justify-content:flex-start}
  .score{grid-area:score;text-align:left}
  .side .big{font-size:42px}
}

/* generator */
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:14px}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:32px;height:32px;font-size:18px}
.stepper span{min-width:32px;text-align:center;font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tcard.y{background:var(--yel-soft);color:var(--yel-ink)}
.tcard.b{background:var(--blu-soft);color:var(--blu-ink)}
.tcard h3{margin:0;font-family:var(--f-display);font-weight:600;text-transform:uppercase;font-size:18px;display:flex;justify-content:space-between}
.tcard ul{margin:0;padding:0;list-style:none;font-weight:600;color:var(--ink)}
.tcard li{padding:2px 0}
.stack{display:flex;flex-direction:column;gap:14px}

/* players admin */
.prow{display:flex;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.prow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 10px}
.prow .g{color:var(--muted);font-size:13px;width:64px;text-align:right}
.prow.off input[type=text]{opacity:.55}
.switch{font-size:13px;display:flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.field input{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink)}
.scorein{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.scorein input{font-family:var(--f-display);font-size:28px;text-align:center;padding:6px}
.scorein .y input{border-color:var(--yel)} .scorein .b input{border-color:var(--blu)}
.scorein .colon{font-family:var(--f-display);font-size:28px;padding-bottom:8px}
.assign{display:flex;flex-direction:column}
.arow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on-n{background:var(--sunk);color:var(--ink)}
.seg button.on-c{background:var(--ink);color:var(--surface)}
.seg button.on-y{background:var(--yel);color:#2A1E00}
.seg button.on-b{background:var(--blu);color:#fff}
.counts{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.counts b.y{color:var(--yel-ink)} .counts b.b{color:var(--blu-ink)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions div{display:flex;gap:8px}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding-top:8px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.loading{padding:48px 16px;text-align:center;color:var(--muted)}

/* links */
a.tag{text-decoration:none}
a.tag:hover{text-decoration:underline}
a.more{color:var(--blu-ink);font-weight:600;text-decoration:none}
a.more:hover{text-decoration:underline}
.back{background:none;border:0;color:var(--muted);padding:0;font-size:14px;align-self:flex-start}

/* player cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:12px 16px 16px}
.pcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:0}
.pcard:hover{background:var(--sunk)}
.pcard .no{font-family:var(--f-display);font-size:26px;font-weight:600;min-width:34px;text-align:center;color:var(--muted);line-height:1}
.pcard b{display:block;font-weight:600}
.pcard small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.pcard.off{opacity:.6}

/* profile */
.prof-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.prof-no{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--yel-soft) 50%,var(--blu-soft) 50%);flex:none}
.prof-name{font-family:var(--f-display);font-weight:700;font-size:32px;text-transform:uppercase;line-height:1.05;margin:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:14px;margin-top:8px}
.meta b{color:var(--ink);font-weight:600}
.quote{margin:10px 0 0;padding:2px 0 2px 12px;border-left:3px solid var(--yel);font-style:italic}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.tile{background:var(--sunk);border-radius:10px;padding:10px 12px}
.tile .tl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile b{font-family:var(--f-display);font-size:24px;font-weight:500}
.tile small{color:var(--muted);font-size:12px}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dotc.y{background:var(--yel)} .dotc.b{background:var(--blu)}
.lastg{display:grid;grid-template-columns:56px 76px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.lastg:last-child{border-bottom:0}
.lastg>span{white-space:nowrap}
.lastg .mates{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-w{color:var(--win)} .res-l{color:var(--loss)} .res-d{color:var(--muted)}
.field select,.field textarea{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;color:var(--ink)}
.field textarea{resize:vertical;min-height:64px}
.warn{color:var(--loss);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* payments */
.cardbox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:12px 14px}
.cardbox b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500;letter-spacing:.04em}
.debt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.debt:last-child{border-bottom:0}
.debt small{display:block;color:var(--muted);font-size:12px}
.debt .sum{font-family:var(--f-display);font-size:20px;color:var(--loss);white-space:nowrap}
.pgame{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pgame .row{align-items:baseline}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:500;background:var(--surface);color:var(--ink);white-space:nowrap}
.pchip.ok{background:var(--win);border-color:var(--win);color:#fff}
.pchip.no{border-style:dashed;color:var(--muted)}
button.pchip.chg{box-shadow:0 0 0 2px var(--yel)}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--btn);color:var(--btn-ink);border-radius:12px;padding:10px 12px;z-index:5}
.savebar .btn{background:var(--btn-ink);color:var(--btn)}
.savebar .btn.ghost{background:transparent;color:var(--btn-ink);border-color:var(--btn-ink)}
.tgok{color:var(--win);font-size:12px;font-weight:600;white-space:nowrap}
.tgno{color:var(--muted);font-size:12px;white-space:nowrap}
.preview{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;margin:0}
.field .hint{font-weight:400;font-size:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.rmode,.wdays{display:flex;flex-wrap:wrap;gap:6px 16px}
.wdays{gap:6px 14px;padding-top:4px}
.sched[data-mode="after"] .m-days,.sched[data-mode="days"] .m-after{display:none}
.field input[type="time"]{width:auto;flex:1;max-width:140px}
.tgbadge{font-size:12px;font-weight:400}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.two>*,.three>*{min-width:0}

/* розклад нагадувань; старий формат {after,every,max,hour} працює без міграції: hour стає часом відправки (так само в bot.mjs) */
function pad2(n){return String(n).padStart(2,"0");}
function hm(t){var m=String(t==null?"":t).trim().match(/^(\d{1,2}):(\d{2})$/);return m&&+m[1]<24&&+m[2]<60?pad2(+m[1])+":"+m[2]:"";}
function normRemind(src){
  var r=JSON.parse(JSON.stringify(Object.assign({},DEF.remind,src||{})));
  if(src&&!Array.isArray(src.times)&&src.hour!=null){r.times=[pad2(src.hour)+":00"];if(src.quiet==null)r.quiet=null;}
  r.mode=r.mode==="days"?"days":"after";
  r.days=(Array.isArray(r.days)?r.days:[]).map(Number).filter(function(d){return d>=1&&d<=7;});
  r.times=(Array.isArray(r.times)?r.times:[]).map(hm).filter(function(t,i,a){return t&&a.indexOf(t)===i;}).sort();
  r.quiet=r.quiet&&typeof r.quiet==="object"?{from:hm(r.quiet.from),to:hm(r.quiet.to)}:{from:"",to:""};
  return r;
}
function tracked(g){var s=SET();return played(g)&&!!s.payFrom&&g.date>=s.payFrom;}
function payers(g){var o=SET().org;return (g.y||[]).concat(g.b||[]).filter(function(id){return id!==o;});}
function paidOf(g){return ui.paydraft&&ui.paydraft[g.id]?ui.paydraft[g.id]:(g.paid||[]);}
function debts(){
  var m={}; sortedGames(S.games.filter(tracked)).forEach(function(g){var pd=paidOf(g);payers(g).forEach(function(id){if(pd.indexOf(id)<0)(m[id]||(m[id]=[])).push(g);});});
  return m;
}
function fmtCard(c){var d=String(c||"").replace(/\D/g,"");return d.length===16?d.replace(/(\d{4})(?=\d)/g,"$1 "):String(c||"");}
function dmon(d){var p=d.split("-");return +p[2]+" "+MONG[+p[1]-1];}
function debtPhrase(list){var ds=list.map(function(g){return dmon(g.date);});return (ds.length>1?"ігри ":"гру ")+(ds.length>1?ds.slice(0,-1).join(", ")+" і "+ds[ds.length-1]:ds[0]);}
function fillT(t,v){return String(t).replace(/\{(\w+)\}/g,function(m,k){return v[k]!=null?v[k]:m;}).replace(/[ \t]+\n/g,"\n").replace(/ {2,}/g," ").trim();}
function tgLink(p){return p&&p.tg?"https://t.me/"+encodeURIComponent(p.tg):"";}
function botLink(id){var b=SET().bot;return b?"https://t.me/"+encodeURIComponent(b)+"?start="+encodeURIComponent(id):"";}
function loadTG(){
  var r=guessRepo(), c=cfgGet(), o=c.owner||r.owner, n=c.repo||r.repo;
  var url=o&&n?"https://raw.githubusercontent.com/"+encodeURIComponent(o)+"/"+encodeURIComponent(n)+"/HEAD/tg.json?t="+Date.now():"tg.json?t="+Date.now();
  fetch(url,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.chats){TG=j;render();}}).catch(function(){});
}
function onTeam(g,id){return (g.y||[]).indexOf(id)>=0?"y":(g.b||[]).indexOf(id)>=0?"b":null;}

function stats(games){
  var st={}, pairs={};
  function P(id){return st[id]||(st[id]={id:id,g:0,w:0,d:0,l:0,gf:0,ga:0,seq:[],months:{},t:{y:{g:0,w:0,d:0,l:0},b:{g:0,w:0,d:0,l:0}}});}
  games.forEach(function(g){
    [["y",+g.sy,+g.sb],["b",+g.sb,+g.sy]].forEach(function(t){
      var ids=g[t[0]]||[], my=t[1], op=t[2], r=my>op?"w":my<op?"l":"d";
      ids.forEach(function(id){var p=P(id);p.g++;p[r]++;p.t[t[0]].g++;p.t[t[0]][r]++;p.gf+=my;p.ga+=op;p.seq.push(r);var m=g.date.slice(0,7);p.months[m]=(p.months[m]||0)+1;});
      for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){
        var k=[ids[i],ids[j]].sort().join("|"); var q=pairs[k]||(pairs[k]={a:k.split("|")[0],b:k.split("|")[1],g:0,w:0,d:0});
        q.g++; if(r==="w")q.w++; if(r==="d")q.d++;
      }
    });
  });
  Object.keys(st).forEach(function(id){
    var p=st[id]; p.pct=p.w/p.g; p.gd=(p.gf-p.ga)/p.g; p.att=games.length?p.g/games.length:0;
    var best=0,run=0; p.seq.forEach(function(r){run=r==="w"?run+1:0; if(run>best)best=run;}); p.bestStreak=best;
    var cur=0,last=p.seq[p.seq.length-1]; for(var i=p.seq.length-1;i>=0&&p.seq[i]===last;i--)cur++; p.cur={r:last,n:cur};
  });
  return {players:st,pairs:pairs};
}

/* ---------- saving ---------- */
function toast(msg){
  var t=document.querySelector(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},3200);
}
function save(next,okMsg,commitMsg){
  if(busy)return;
  var c=cfgGet(); if(!c.token){editor=false;render();toast("Увійдіть як редактор, щоб зберігати");return;}
  if(S.settings&&next.settings===undefined)next.settings=S.settings;
  busy=true; render();
  var body={message:commitMsg||okMsg||"Оновлення статистики",content:b64enc(JSON.stringify(next,null,1)+"\n"),sha:sha};
  gh(c,"/contents/data.json",{method:"PUT",body:body}).then(function(r){
    if(!r.ok){return r.text().then(function(){throw new Error(ghError(r));});}
    return r.json();
  }).then(function(j){
    sha=j.content&&j.content.sha; S=next; busy=false; ui.form=null; ui.players=null; ui.pedit=null; ui.paydraft=null; ui.sets=null; render();
    toast((okMsg||"Збережено")+". Сайт для всіх оновиться за 1–2 хв");
  }).catch(function(e){busy=false; render(); toast(e.message&&e.message.length>8?e.message:"Немає звʼязку з GitHub. Спробуйте ще раз");});
}

/* ---------- views ---------- */
function board(games){
  var y=0,b=0,d=0,goals=0; games.forEach(function(g){var a=+g.sy,c=+g.sb;goals+=a+c;if(a>c)y++;else if(c>a)b++;else d++;});
  var n=games.length, last=games[games.length-1];
  var st=stats(games).players, top=null; Object.keys(st).forEach(function(id){if(!top||st[id].g>st[top].g)top=id;});
  var lastTxt=last?(function(){var f=fmtDate(last.date);return f.day+" "+f.mon+" · "+last.sy+":"+last.sb;})():"—";
  return '<section class="board" aria-label="Підсумок сезону">'+
    '<div class="side y"><span class="lbl">Жовті</span><span class="big num">'+y+'</span></div>'+
    '<div class="mid"><b class="num">'+d+'</b>нічиїх</div>'+
    '<div class="side b"><span class="lbl">Сині</span><span class="big num">'+b+'</span></div>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+(n?y/n*100:0)+'%;background:var(--yel)"></i><i style="width:'+(n?d/n*100:0)+'%;background:var(--draw)"></i><i style="width:'+(n?b/n*100:0)+'%;background:var(--blu)"></i></div>'+
    '<div class="facts"><span>Ігор: <b class="num">'+n+'</b></span><span>Голів за гру: <b class="num">'+(n?(goals/n).toFixed(1):"—")+'</b></span>'+
    '<span>Найчастіше грав: <b>'+(top?esc(pname(top))+" ("+st[top].g+")":"—")+'</b></span><span>Остання гра: <b class="num">'+lastTxt+'</b></span>'+bdayLine()+debtLine()+'</div>'+
  '</section>';
}
function debtLine(){
  if(!SET().payFrom)return "";
  var d=debts(), ids=Object.keys(d); if(!ids.length)return '<span>💸 Усі розрахувалися</span>';
  var n=0; ids.forEach(function(k){n+=d[k].length;});

/* ДН активних гравців у найближчі 7 днів */
function bdayLine(){
  var list=[]; S.players.forEach(function(p){if(p.active===false)return; var bi=bdayInfo(p.bd); if(bi&&bi.days<=7)list.push({p:p,bi:bi});});
  if(!list.length)return "";
  list.sort(function(a,b){return a.bi.days-b.bi.days;});

function ratingView(games){
  if(!games.length)return '<div class="panel"><p class="empty">У цьому сезоні ще немає зіграних матчів.</p></div>';
  var data=stats(games), st=data.players, k=ui.sort.k, d=ui.sort.d;
  var minG=minGames(games.length);
  var rows=Object.keys(st).map(function(id){return st[id];});
  var val=function(p){return k==="name"?pname(p.id):k==="pts"?p.w*3+p.d:p[k];};
  rows.sort(function(a,b){var x=val(a),y=val(b); if(typeof x==="string")return d*x.localeCompare(y,"uk"); return d*(x-y)||(b.g-a.g);});
  var gated=(k==="pct"||k==="gd");
  var main=gated?rows.filter(function(p){return p.g>=minG;}):rows, low=gated?rows.filter(function(p){return p.g<minG;}):[];
  function th(key,label,title){return '<th class="'+(k===key?"on":"")+'"><button data-sort="'+key+'" title="'+title+'">'+label+(k===key?(d<0?" ↓":" ↑"):"")+'</button></th>';}
  function row(p,i,isLow){
    var form=p.seq.slice(-5).map(function(r){return '<span class="'+r+'" title="'+(r==="w"?"Перемога":r==="l"?"Поразка":"Нічия")+'"></span>';}).join("");
    var h='<tr class="p'+(isLow?" low":"")+'" data-open="'+p.id+'" tabindex="0" aria-expanded="'+(ui.open===p.id)+'"><td>'+(isLow?"·":i+1)+'</td><td class="name">'+esc(pname(p.id))+'</td>'+
      '<td>'+p.g+'</td><td>'+p.w+'–'+p.d+'–'+p.l+'</td><td>'+(p.w*3+p.d)+'</td>'+
      '<td><span class="pct"><i><s style="width:'+(p.pct*100)+'%"></s></i>'+pctS(p.pct)+'</span></td>'+
      '<td class="'+(p.gd>0.05?"pos":p.gd<-0.05?"neg":"")+'">'+sgn(p.gd)+'</td><td><span class="form">'+form+'</span></td><td>'+pctS(p.att)+'</td></tr>';
    if(ui.open===p.id)h+='<tr class="det"><td colspan="9">'+detail(p,data,games)+'<p style="margin:12px 0 0"><a class="more" href="#'+esc(p.id)+'">Повний профіль →</a></p></td></tr>';
    return h;
  }
  var body=main.map(function(p,i){return row(p,i,false);}).join("");
  if(low.length)body+='<tr class="sep"><td colspan="9">Менше '+minG+' ігор: у рейтингу % не враховуються</td></tr>'+low.map(function(p,i){return row(p,i,true);}).join("");
  return '<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>#</th>'+th("name","Гравець","За імʼям")+th("g","І","Ігор")+'<th title="Перемоги–нічиї–поразки">В–Н–П</th>'+th("pts","Оч","3 за перемогу, 1 за нічию")+th("pct","%В","Відсоток перемог")+th("gd","+/−","Різниця мʼячів команди за гру")+'<th>Форма</th>'+th("att","Відв.","Відвідуваність сезону")+'</tr></thead><tbody>'+body+'</tbody></table></div></div>'+
    pairsView(data);
}

function detail(p,data,games){
  var mates=[]; Object.keys(data.pairs).forEach(function(k){var q=data.pairs[k]; if(q.g>=3&&(q.a===p.id||q.b===p.id))mates.push({id:q.a===p.id?q.b:q.a,g:q.g,w:q.w,pct:q.w/q.g});});
  mates.sort(function(a,b){return b.pct-a.pct||b.g-a.g;});
  var best=mates.slice(0,3), worst=mates.slice(-3).reverse().filter(function(m){return best.indexOf(m)<0;});
  function ml(list){return list.length?list.map(function(m){return '<div class="mate"><span>'+esc(pname(m.id))+'</span><span>'+m.w+' з '+m.g+' · '+pctS(m.pct)+'</span></div>';}).join(""):'<div class="note">Замало спільних ігор</div>';}
  var gm={}; games.forEach(function(g){var m=g.date.slice(0,7);gm[m]=(gm[m]||0)+1;});
  var ms=Object.keys(gm).sort();
  var bars=ms.map(function(m){var v=p.months[m]||0;return '<div title="'+v+' з '+gm[m]+'"><i style="height:'+Math.round(v/gm[m]*40)+'px"></i>'+MON[+m.slice(5)-1]+'</div>';}).join("");
  var seq=p.seq.slice(-15).map(function(r){return '<span class="'+r+'"></span>';}).join("");
  var cur=p.cur.n>1?(p.cur.r==="w"?p.cur.n+" перемог поспіль":p.cur.r==="l"?p.cur.n+" поразок поспіль":p.cur.n+" нічиїх поспіль"):"—";
  return '<div class="det-grid">'+
    '<div><h4>Найкраще разом</h4>'+ml(best)+'</div>'+
    '<div><h4>Найгірше разом</h4>'+ml(worst)+'</div>'+
    '<div><h4>Відвідуваність по місяцях</h4><div class="months">'+bars+'</div></div>'+
    '<div><h4>Останні ігри</h4><div class="seq">'+seq+'</div><p class="note">Зараз: '+cur+' · Найдовша серія перемог: '+p.bestStreak+'</p></div>'+
  '</div>';
}

function pairsView(data){
  var list=Object.keys(data.pairs).map(function(k){return data.pairs[k];}).filter(function(q){return q.g>=4;});
  if(!list.length)return "";
  list.forEach(function(q){q.pct=q.w/q.g;});
  var best=list.slice().sort(function(a,b){return b.pct-a.pct||b.g-a.g;}).slice(0,5);
  var worst=list.slice().sort(function(a,b){return a.pct-b.pct||b.g-a.g;}).slice(0,5);
  function li(q){return '<div class="pair"><span><b>'+esc(pname(q.a))+'</b> + <b>'+esc(pname(q.b))+'</b></span><span class="num">'+q.w+' з '+q.g+' · '+pctS(q.pct)+'</span></div>';}
  return '<div class="panel"><div style="padding:14px 16px 4px"><h2 class="h">Звʼязки</h2><p class="sub">Пари в одній команді, від 4 спільних ігор</p></div>'+
    '<div class="pairs"><div><p class="sub" style="margin:8px 0 0">Найчастіше виграють</p>'+best.map(li).join("")+'</div><div><p class="sub" style="margin:8px 0 0">Найчастіше програють</p>'+worst.map(li).join("")+'</div></div></div>';
}

function matchesView(){
  var list=sortedGames(S.games.filter(inSeason)).reverse();
  if(!list.length)return '<div class="panel"><p class="empty">Матчів ще немає.'+(editor?' Додайте перший кнопкою «+ Гра».':'')+'</p></div>';

    var f=fmtDate(g.date), pl=played(g), y=+g.sy, b=+g.sb;

    var sc=pl?'<span class="ys'+(y<b?" lose":"")+'">'+y+'</span> : <span class="bs'+(b<y?" lose":"")+'">'+b+'</span><small>'+(y>b?"Перемогли жовті":b>y?"Перемогли сині":"Нічия")+'</small>':g.x?'<span class="xgame">Скасовано</span>':'<small>Без рахунку</small>';
    return '<div class="match'+(g.x?" off":"")+'"><div class="date"><b class="num">'+f.day+'</b>'+f.mon+' '+f.year+'</div>'+
      '<div class="team y">'+tags("y",g.gy)+'</div><div class="score num">'+sc+'</div><div class="team b">'+tags("b",g.gb)+'</div>'+

  }).join("")+'</div>';
}

/* запланована / скасована гра: хто буде, оголошення */
function planView(g){
  var ids=gameIds(g), n=gameCount(g), ann=g.ann||{}, ch=TG.chats||{};
  var wr=!g.x&&wxFor(g), wl=wr&&wr.any?WX.line(wr):"";
  var h='<div class="plan">'+(wl?'<p class="wxline">'+esc(wl)+'</p>':'')+'<p class="who"><b>Буде: <span class="num">'+n+'/10</span></b>'+(n?' · '+esc(gameList(g)):' · поки нікого')+'</p>';
  var st=[]; if(ann.gather)st.push("📣 Збір оголошено "+fmtStamp(ann.gather)); if(ann.cancel)st.push("❌ Скасування надіслано "+fmtStamp(ann.cancel));
  if(st.length)h+='<p class="note">'+st.join(" · ")+'</p>';
  if(editor&&!g.x&&n>=10&&!ann.gather)h+='<p class="hint10">👍 Набралось 10 — оголосити збір?</p>';
  h+='<div class="row plan-act">'+(n>=2&&!g.x?'<button class="btn ghost small" data-genfrom="'+g.id+'">Поділити на команди</button>':'');
  if(editor)h+='<button class="btn ghost small" data-ann="gather|'+g.id+'">Збір є ✅</button><button class="btn ghost small" data-ann="cancel|'+g.id+'">Збір скасовано ❌</button>';
  h+='</div>';
  if(editor&&ids.length){
    var no=ids.filter(function(id){return !ch[id];});
    h+='<p class="note">'+(no.length?'Не дійде (немає бота), напишіть самі: <b>'+esc(no.map(pname).join(", "))+'</b>':'🤖 Бот підключений у всіх, повідомлення дійде кожному')+'</p>';
  }
  return h+'</div>';
}
function dispatch(inputs){
  var c=cfgGet(); if(!c.token){toast("Увійдіть як редактор");return Promise.resolve(false);}
  return gh(c,"").then(function(r){return r.ok?r.json():{default_branch:"main"};}).then(function(repo){
    return gh(c,"/actions/workflows/bot.yml/dispatches",{method:"POST",body:{ref:repo.default_branch||"main",inputs:inputs}});
  }).then(function(r){
    if(r.status===204)return true;
    if(r.status===403)toast("Токену бракує права Actions: Read and write. Додайте його в налаштуваннях токена на GitHub");
    else if(r.status===404)toast("Не знайдено .github/workflows/bot.yml. Перевірте, що файл бота завантажено в репозиторій");
    else if(r.status===422)toast("Workflow бота застарів: оновіть .github/workflows/bot.yml з репозиторію");
    else toast("GitHub відповів помилкою "+r.status);
    return false;
  }).catch(function(){toast("Немає звʼязку з GitHub");return false;});
}
/* «Збір є» / «Збір скасовано»: бот пише гравцям гри, сайт записує ann (і x для скасування) */
function announceGame(kind,gid){
  var g=S.games.filter(function(x){return x.id===gid;})[0]; if(!g||busy||ui.annBusy)return;
  var ids=gameIds(g), ann=g.ann||{}, d=dmon(g.date);
  if(!ids.length){toast("У грі ще нікого не відмічено");return;}
  if(kind==="gather"&&g.x){if(!window.confirm("Гру "+d+" скасовано. Оголосити збір і зняти скасування?"))return;}
  else if(ann[kind]&&!window.confirm((kind==="gather"?"Збір уже оголошували ":"Скасування вже надсилали ")+fmtStamp(ann[kind])+". Надіслати ще раз?"))return;
  ui.annBusy=true;
  dispatch({mode:kind,game:gid}).then(function(ok){
    ui.annBusy=false; if(!ok)return;
    var games=S.games.map(function(x){
      if(x.id!==gid)return x;
      var n={}; Object.keys(x).forEach(function(k){n[k]=x[k];});
      n.ann=Object.assign({},x.ann||{}); n.ann[kind]=new Date().toISOString();
      if(kind==="cancel")n.x=true; else delete n.x;
      return n;
    });
    save({v:S.v,players:S.players,games:games},kind==="gather"?"Бот надішле «Збір є» за хвилину-дві":"Гру скасовано, бот надішле повідомлення за хвилину-дві",(kind==="gather"?"Збір є: гра ":"Збір скасовано: гра ")+g.date);
  });
}

/* generator */
function strengths(){
  var st=stats(S.games.filter(played)).players, m={};
  S.players.forEach(function(p){var s=st[p.id]; m[p.id]=s?((s.w+0.5*s.d+2.5)/(s.g+5)+0.02*((s.gf-s.ga)/(s.g+5))):0.5;});
  return m;
}
function generate(){
  var str=strengths(), units=ui.gen.sel.map(function(id){return {id:id,s:str[id]};});
  for(var i=0;i<ui.gen.guests;i++)units.push({guest:true,s:0.45});
  var n=units.length; if(n<2){ui.gen.res=null;return;}
  var half=Math.floor(n/2), out=[];
  (function rec(start,pick){
    if(pick.length===half){
      if(n%2===0&&pick[0]!==0)return;
      var inA={};pick.forEach(function(i){inA[i]=1;});
      var A=[],B=[];units.forEach(function(u,i){(inA[i]?A:B).push(u);});
      var avg=function(t){return t.reduce(function(s,u){return s+u.s;},0)/t.length;};
      var gA=A.filter(function(u){return u.guest;}).length,gB=B.length-B.filter(function(u){return !u.guest;}).length;
      out.push({A:A,B:B,cost:Math.abs(avg(A)-avg(B))+(Math.abs(gA-gB)>1?0.05:0),sa:avg(A),sb:avg(B)}); return;
    }
    for(var i=start;i<n;i++){pick.push(i);rec(i+1,pick);pick.pop();}
  })(0,[]);
  out.sort(function(a,b){return a.cost-b.cost;});
  ui.gen.res=out.slice(0,8); ui.gen.pick=0;
}

function togglePay(gid,pid){
  var g=S.games.filter(function(x){return x.id===gid;})[0]; if(!g)return;
  ui.paydraft=ui.paydraft||{}; var d=(ui.paydraft[gid]||(g.paid||[])).slice(), i=d.indexOf(pid);
  if(i>=0)d.splice(i,1); else d.push(pid); ui.paydraft[gid]=d; render();
}
function savePay(){
  if(!ui.paydraft)return; var names=[], dates={};
  var games=S.games.map(function(g){
    var d=ui.paydraft[g.id]; if(!d)return g;
    var py=payers(g), o=g.paid||[], n={}; Object.keys(g).forEach(function(k){n[k]=g[k];});
    py.forEach(function(id){if(d.indexOf(id)>=0&&o.indexOf(id)<0){names.push(pname(id));dates[dmon(g.date)]=1;}});
    var keep=(g.y||[]).concat(g.b||[]).filter(function(id){return d.indexOf(id)>=0;});
    if(keep.length)n.paid=keep; else delete n.paid; return n;
  });
  var msg="Оплата"+(names.length?": "+names.join(", ")+" ("+Object.keys(dates).join(", ")+")":": зміни");
  save({v:S.v,players:S.players,games:games},"Оплату збережено",msg);
}

  });
}

function readSets(){
  var s=ui.sets; if(!s)return; function v(id){var el=document.getElementById(id);return el?el.value:null;}
  function num(id,def){var x=v(id);return x===null||x===""||isNaN(+x)?def:+x;}
  if(v("s-price")===null)return;
  s.price=num("s-price",s.price); s.payFrom=v("s-from")||""; s.org=v("s-org")||""; s.card=v("s-card").trim(); s.cardName=v("s-cname").trim(); s.bank=v("s-bank").trim();
  s.bot=v("s-bot").trim().replace(/^(https?:\/\/)?t\.me\//i,"").replace(/^@/,"");
  var mode=document.querySelector('input[name="s-rmode"]:checked'), days=[];
  Array.prototype.forEach.call(document.querySelectorAll("[data-wd]"),function(el){if(el.checked)days.push(+el.dataset.wd);});
  ui.timesRaw=v("s-times");
  var raw=ui.timesRaw.split(/[,;\s]+/).filter(Boolean), times=raw.map(hm);
  s.remind=Object.assign({},s.remind,{on:document.getElementById("s-ron").checked,mode:mode?mode.value:"after",after:Math.max(0,num("s-after",1)),days:days,
    times:times.filter(function(t,i,a){return t&&a.indexOf(t)===i;}).sort(),quiet:{from:v("s-qfrom")||"",to:v("s-qto")||""},every:Math.max(1,num("s-every",2)),max:Math.max(1,num("s-max",3))});
  s.remind._bad=times.some(function(t){return !t||+t.slice(3)%15;});
  s.thanks=splitT(v("s-thanks")); s.reminders=splitT(v("s-rem")); s.hello=v("s-hello").trim();
  s.time=v("s-time")||""; s.place=v("s-place").trim();
  s.city=v("s-city").trim(); s.lat=num("s-lat",s.lat); s.lon=num("s-lon",s.lon); s.rainWarn=Math.min(100,Math.max(1,Math.round(num("s-warn",90)))); s.sinoptik=v("s-sin").trim(); s.meteo=v("s-met").trim(); s.gather=splitT(v("s-gather")); s.cancel=splitT(v("s-cancel"));
  s.verdicts={w:splitT(v("s-vw")),l:splitT(v("s-vl")),d:splitT(v("s-vd"))};
}
function saveSets(){
  readSets(); var s=ui.sets;
  if(!s.thanks.length||!s.reminders.length){toast("Потрібен хоча б один текст подяки й нагадування");return;}
  if(!(Math.abs(s.lat)<=90&&Math.abs(s.lon)<=180)){toast("Погода: широта від −90 до 90, довгота від −180 до 180");return;}
  if((s.sinoptik&&!/^https:\/\//.test(s.sinoptik))||(s.meteo&&!/^https:\/\//.test(s.meteo))){toast("Посилання на погоду мають починатися з https://");return;}
  if(!s.gather.length||!s.cancel.length){toast("Потрібен хоча б один текст «Збір є» і «Збір скасовано»");return;}
  if(s.bank&&!/^https:\/\//.test(s.bank)){toast("Посилання на оплату має починатися з https://");return;}
  var r=s.remind;
  if(r._bad){toast("Час відправки: формат ГГ:ХХ з кроком 15 хв, напр. 12:00, 19:30");return;}
  if(r.on&&!r.times.length){toast("Вкажіть хоча б один час відправки");return;}
  if(r.on&&r.mode==="days"&&!r.days.length){toast("Виберіть хоча б один день тижня");return;}
  if(!r.quiet.from!==!r.quiet.to){toast("Тихі години: вкажіть обидва часи або залиште обидва порожніми");return;}
  ui.timesRaw=null;
  /* не губити поля налаштувань, яких форма не знає */
  var old=S.settings||{}; s=Object.assign({},old,s); s.remind=Object.assign({},old.remind||{},r); delete s.remind._bad;
  save({v:S.v,settings:s,players:S.players,games:S.games},"Налаштування збережено","Налаштування оплати й бота");
}

  ui.form={id:g?g.id:null,date:g?g.date:nextFriday(),a:a,gy:preset?preset.A.filter(function(u){return u.guest;}).length:g?(g.gy||0):0,gb:preset?preset.B.filter(function(u){return u.guest;}).length:g?(g.gb||0):0,
    sy:g&&g.sy!=null?String(g.sy):"",sb:g&&g.sb!=null?String(g.sb):"",extra:[],confirmDel:false};
  render(); var el=document.getElementById("f-date"); if(el)el.focus();
}
function formView(){
  var f=ui.form; if(!f)return "";
  var all=S.players.concat(f.extra);
  var shown=all.filter(function(p){return p.active!==false||f.a[p.id];});
  var ny=0,nb=0,nc=0; Object.keys(f.a).forEach(function(k){if(f.a[k]==="y")ny++;if(f.a[k]==="b")nb++;if(f.a[k]==="c")nc++;});
  var rows=shown.map(function(p){var v=f.a[p.id]||"n";return '<div class="arow"><span>'+esc(p.name)+'</span><span class="seg" role="group" aria-label="'+esc(p.name)+'">'+
    '<button data-as="'+p.id+'|n" class="'+(v==="n"?"on-n":"")+'" aria-label="Не буде">—</button><button data-as="'+p.id+'|c" class="'+(v==="c"?"on-c":"")+'" title="Прийде, команда ще невідома">Буде</button>'+
    '<button data-as="'+p.id+'|y" class="'+(v==="y"?"on-y":"")+'">Жовті</button><button data-as="'+p.id+'|b" class="'+(v==="b"?"on-b":"")+'">Сині</button></span></div>';}).join("");
  function step(t){return '<span class="stepper"><button data-act="fg-'+t+'-minus" aria-label="Менше">−</button><span class="num">'+f["g"+t]+'</span><button data-act="fg-'+t+'-plus" aria-label="Більше">+</button></span>';}
  return '<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="f-title">'+
    '<div class="row"><h2 class="h" id="f-title">'+(f.id?"Змінити гру":"Нова гра")+'</h2><button class="edit" data-act="close">Закрити</button></div>'+
    '<label class="field">Дата<input type="date" id="f-date" value="'+f.date+'"></label>'+
    '<div class="scorein"><label class="field y">Жовті<input type="number" inputmode="numeric" min="0" id="f-sy" value="'+esc(f.sy)+'" placeholder="–"></label><span class="colon">:</span><label class="field b">Сині<input type="number" inputmode="numeric" min="0" id="f-sb" value="'+esc(f.sb)+'" placeholder="–"></label></div>'+
    '<p class="note">Залиште рахунок порожнім, якщо гра ще попереду: вона збережеться без впливу на статистику. «Буде» — прийде, команда ще невідома; перед рахунком розкидайте всіх по командах.</p>'+
    '<div class="counts"><span>Буде: <b class="num">'+nc+'</b></span><span>Жовті: <b class="y num">'+(ny+f.gy)+'</b></span><span>Сині: <b class="b num">'+(nb+f.gb)+'</b></span><span>Разом: <b class="num">'+(nc+ny+nb+f.gy+f.gb)+'/10</b></span></div>'+
    '<div class="assign">'+rows+'</div>'+
    '<div class="row"><span class="switch">Гості за жовтих '+step("y")+'</span><span class="switch">Гості за синіх '+step("b")+'</span></div>'+
    '<div class="inline-add"><input type="text" id="f-new" placeholder="Новий гравець"><button class="btn ghost small" data-act="f-add">Додати</button></div>'+
    '<div class="actions"><div>'+(f.id?(f.confirmDel?'<button class="btn danger small" data-act="f-del-yes">Так, видалити</button><button class="btn ghost small" data-act="f-del-no">Ні</button>':'<button class="btn ghost small" data-act="f-del">Видалити гру</button>'):'')+'</div>'+
    '<div><button class="btn ghost" data-act="close">Скасувати</button><button class="btn" data-act="f-save"'+(busy?" disabled":"")+'>'+(busy?"Зберігаю…":"Зберегти")+'</button></div></div>'+
  '</div></div>';
}
function readForm(){var f=ui.form;if(!f)return;var d=document.getElementById("f-date");if(d)f.date=d.value;var a=document.getElementById("f-sy");if(a)f.sy=a.value;var b=document.getElementById("f-sb");if(b)f.sb=b.value;}
function newId(prefix,list){var i=list.length+1;while(list.some(function(x){return x.id===prefix+i;}))i++;return prefix+i;}

function loginView(){
  var l=ui.login; if(!l)return "";
  return '<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="l-title">'+
    '<div class="row"><h2 class="h" id="l-title">Вхід для редактора</h2><button class="edit" data-act="close">Закрити</button></div>'+
    '<p class="note">Потрібен fine-grained токен GitHub з доступом лише до цього репозиторію і правом Contents: Read and write. Токен зберігається тільки в цьому браузері.</p>'+
    '<label class="field">Власник репозиторію<input type="text" id="l-owner" value="'+esc(l.owner)+'" autocomplete="off" autocapitalize="off"></label>'+
    '<label class="field">Назва репозиторію<input type="text" id="l-repo" value="'+esc(l.repo)+'" autocomplete="off" autocapitalize="off"></label>'+
    '<label class="field">Токен<input type="password" id="l-token" value="" placeholder="github_pat_…" autocomplete="off"></label>'+
    '<div class="actions"><div></div><div><button class="btn ghost" data-act="close">Скасувати</button><button class="btn" data-act="l-go"'+(busy?" disabled":"")+'>'+(busy?"Перевіряю…":"Увійти")+'</button></div></div>'+
  '</div></div>';
}
function doLogin(){
  var c={owner:document.getElementById("l-owner").value.trim(),repo:document.getElementById("l-repo").value.trim(),token:document.getElementById("l-token").value.trim()};
  if(!c.owner||!c.repo||!c.token){toast("Заповніть усі три поля");return;}
  busy=true; render();
  loadEditor(c).then(function(d){
    cfgSet(c); S=d; editor=true; busy=false; ui.login=null; loaded=true; render(); toast("Ви увійшли як редактор");
  }).catch(function(e){busy=false; render(); toast(e.status?e.message:"Не вдалося підʼєднатися до GitHub. Перевірте дані");});
}
function render(){
  if(!loaded){app.innerHTML='<div class="wrap"><h1 class="brand"><span class="dot" aria-hidden="true"></span>Пʼятниця 5×5</h1><div class="panel"><p class="empty">'+esc(ui.loadError||"Завантажую статистику…")+'</p></div>'+foot()+'</div>'+loginView();return;}
  var season=curSeason(), games=sortedGames(S.games.filter(function(g){return played(g)&&inSeason(g);}));
  var ys=years(), seasons=ys.slice().reverse().map(function(y){return '<button class="chip" data-season="'+y+'" aria-pressed="'+(season===y)+'">'+y+'</button>';}).join("")+
    (ys.length>1||!ys.length?'<button class="chip" data-season="all" aria-pressed="'+(season==="all")+'">Весь час</button>':'');
  var tabs=[["rating","Рейтинг"],["matches","Матчі"],["gen","Команди"],["players","Гравці"],["pay","Оплата"]].concat(editor?[["settings","Налаштування"]]:[]);
  if(!editor&&ui.tab==="settings")ui.tab="rating";
  if(!editor)ui.manage=false;
  var prof=ui.profile, curTab=prof?"players":ui.tab;
  if(wxGame())loadWX();
  var body=prof?profileView(prof):ui.tab==="matches"?matchesView():ui.tab==="gen"?genView():ui.tab==="pay"?payView():ui.tab==="settings"?settingsView():ui.tab==="players"?(ui.manage?playersView():cardsView()):ratingView(games);
  var pp=prof&&pmap()[prof]; document.title=pp?pp.name+" · Пʼятниця 5×5":"Пʼятниця 5×5";
  app.innerHTML='<div class="wrap">'+
    '<header class="top"><h1 class="brand"><span class="dot" aria-hidden="true"></span>Пʼятниця 5×5</h1>'+(editor?'<button class="btn" data-act="new-game">+ Гра</button>':'')+'</header>'+
    (prof||["gen","players","pay","settings"].indexOf(ui.tab)>=0?"":board(games)+wxBlock())+
    (prof||["gen","players","pay","settings"].indexOf(ui.tab)<0?'<div class="row"><div class="chips" role="group" aria-label="Сезон">'+seasons+'</div></div>':"")+
    '<nav class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(curTab===t[0])+'">'+t[1]+'</button>';}).join("")+'</nav>'+
    body+foot()+'</div>'+formView()+loginView()+peditView();
}
function foot(){
  return '<footer class="foot"><span>Дані: data.json у репозиторії</span>'+
    (editor?'<button data-act="logout">Вийти з режиму редактора</button>':'<button data-act="login">Увійти як редактор</button>')+'</footer>';
}

/* ---------- events ---------- */
function clearHash(){if(location.hash)history.replaceState(null,"",location.pathname+location.search);ui.profile=null;}
function route(){var m=location.hash.match(/^#(p[\w-]+)$/);ui.profile=m?m[1]:null;}
window.addEventListener("hashchange",function(){route();render();window.scrollTo(0,0);});
app.addEventListener("click",function(e){
  if(e.target.closest('a[href^="#p"]')){ui.inApp=true;return;}
  var t=e.target.closest("button,[data-open],[data-act]"); if(!t)return;
  var ds=t.dataset;
  if(ds.season){ui.season=ds.season;ui.open=null;render();return;}
  if(ds.tab){if(ui.tab==="settings")readSets(); ui.tab=ds.tab;ui.manage=false;ui.preview=null;ui.previewG=null;clearHash();render();window.scrollTo(0,0);return;}
  if(ds.pay){var pp=ds.pay.split("|");togglePay(pp[0],pp[1]);return;}
  if(ds.remind){remindNow(ds.remind);return;}
  if(ds.ann){var an=ds.ann.split("|");announceGame(an[0],an[1]);return;}
  if(ds.genfrom){var gf=S.games.filter(function(x){return x.id===ds.genfrom;})[0]; if(!gf)return;
    ui.gen={sel:gameIds(gf),guests:(+gf.gy||0)+(+gf.gb||0),pick:0,res:null,gid:gf.id}; generate(); ui.tab="gen"; clearHash(); render(); window.scrollTo(0,0); return;}
  if(ds.copy!=null){var txt=ds.copy;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast("Скопійовано");}).catch(function(){window.prompt("Скопіюйте:",txt);});return;}
  if(ds.sort){var k=ds.sort; ui.sort=ui.sort.k===k?{k:k,d:-ui.sort.d}:{k:k,d:k==="name"?1:-1}; render();return;}
  if(ds.open){ui.open=ui.open===ds.open?null:ds.open;render();return;}
  if(ds.edit){var g=S.games.filter(function(x){return x.id===ds.edit;})[0]; if(g)openForm(g); return;}
  if(ds.gsel){var i=ui.gen.sel.indexOf(ds.gsel); if(i>=0)ui.gen.sel.splice(i,1); else ui.gen.sel.push(ds.gsel); ui.gen.res=null; render(); return;}
  if(ds.as){readForm(); var p=ds.as.split("|"); if(p[1]==="n")delete ui.form.a[p[0]]; else ui.form.a[p[0]]=p[1]; render(); return;}
  if(ds.pdel!=null){ui.players.splice(+ds.pdel,1);render();return;}
  var a=ds.act; if(!a)return;
  if(a==="close-bg"&&e.target!==t)return;
  switch(a){
    case "new-game": openForm(null); break;
    case "close": case "close-bg": ui.form=null; ui.login=null; ui.pedit=null; render(); break;
    case "back": if(ui.inApp){ui.inApp=false;history.back();}else{clearHash();render();window.scrollTo(0,0);} break;
    case "manage": ui.manage=true; render(); break;
    case "manage-off": ui.manage=false; ui.players=null; render(); break;
    case "pe-open": if(ui.profile)openPedit(ui.profile); break;
    case "pe-save": savePedit(); break;
    case "pay-save": savePay(); break;
    case "pay-cancel": ui.paydraft=null; render(); break;
    case "pay-all": ui.payAll=!ui.payAll; render(); break;
    case "s-save": saveSets(); break;
    case "s-reset": readSets(); ui.sets.thanks=DEF.thanks.slice(); ui.sets.reminders=DEF.reminders.slice(); ui.sets.hello=DEF.hello; ui.sets.verdicts=JSON.parse(JSON.stringify(DEF.verdicts)); ui.sets.gather=DEF.gather.slice(); ui.sets.cancel=DEF.cancel.slice(); ui.preview=null; ui.previewG=null; render(); toast("Стандартні тексти повернуто. Не забудьте зберегти"); break;
    case "s-pv-g": case "s-pv-c": readSets(); var so2=ui.sets, arr2=a==="s-pv-g"?so2.gather:so2.cancel;
      var pg=sortedGames(S.games.filter(function(x){return !played(x)&&gameIds(x).length;})).pop()||sortedGames(S.games.filter(played)).pop();
      ui.previewG=!arr2.length?"Немає текстів":pg?fillT(arr2[Math.floor(Math.random()*arr2.length)],gameVars(pg,gameIds(pg)[0],so2)):"Немає ігор для прикладу"; render(); break;
    case "s-pv-t": case "s-pv-r": readSets(); var sv=sampleVars(), arr=a==="s-pv-t"?ui.sets.thanks:ui.sets.reminders; var so=ui.sets; sv.sum=sv.sum/SET().price*so.price; sv.card=fmtCard(so.card)||"[картка]"; sv.cardName=so.cardName?"("+so.cardName+")":""; sv.verdict=(so.verdicts.w[0]||""); ui.preview=arr.length?fillT(arr[Math.floor(Math.random()*arr.length)],sv):"Немає текстів"; render(); break;
    case "login": var gr=guessRepo(), cc=cfgGet(); ui.login={owner:cc.owner||gr.owner,repo:cc.repo||gr.repo}; render(); var lt=document.getElementById(ui.login.owner?"l-token":"l-owner"); if(lt)lt.focus(); break;
    case "l-go": doLogin(); break;
    case "logout": cfgSet(null); editor=false; sha=null; ui.manage=false; ui.pedit=null; ui.paydraft=null; ui.sets=null; render(); toast("Ви вийшли. Токен видалено з цього браузера"); break;
    case "g-plus": ui.gen.guests++; ui.gen.res=null; render(); break;
    case "g-minus": ui.gen.guests=Math.max(0,ui.gen.guests-1); ui.gen.res=null; render(); break;
    case "gen-clear": ui.gen.sel=[]; ui.gen.guests=0; ui.gen.res=null; ui.gen.gid=null; render(); break;
    case "gen-run": generate(); render(); break;
    case "gen-next": if(ui.gen.res){ui.gen.pick=(ui.gen.pick+1)%ui.gen.res.length;} render(); break;
    case "gen-record": if(ui.gen.res)openForm(ui.gen.gid&&S.games.filter(function(x){return x.id===ui.gen.gid;})[0]||null,ui.gen.res[ui.gen.pick]); break;
    case "fg-y-plus": readForm(); ui.form.gy++; render(); break;
    case "fg-y-minus": readForm(); ui.form.gy=Math.max(0,ui.form.gy-1); render(); break;
    case "fg-b-plus": readForm(); ui.form.gb++; render(); break;
    case "fg-b-minus": readForm(); ui.form.gb=Math.max(0,ui.form.gb-1); render(); break;
    case "f-add": readForm(); var inp=document.getElementById("f-new"), nm=inp&&inp.value.trim(); if(nm){var id=newId("p",S.players.concat(ui.form.extra)); ui.form.extra.push({id:id,name:nm,active:true});} render(); break;
    case "f-del": readForm(); ui.form.confirmDel=true; render(); break;
    case "f-del-no": readForm(); ui.form.confirmDel=false; render(); break;
    case "f-del-yes": var del=ui.form.id; save({v:S.v,players:S.players,games:S.games.filter(function(x){return x.id!==del;})},"Гру видалено","Видалено гру "+ui.form.date); break;
    case "f-save": saveForm(); break;
    case "p-add": var ni=document.getElementById("new-player"),nn=ni&&ni.value.trim(); if(nn){ui.players.push({id:newId("p",ui.players.concat(S.players)),name:nn,active:true});} render(); break;
    case "p-save": var orig=pmap(); var clean=ui.players.filter(function(p){return p.name.trim();}).map(function(p){var o=orig[p.id]||{},n={};Object.keys(o).forEach(function(k){n[k]=o[k];});n.id=p.id;n.name=p.name.trim();n.active=p.active;return n;}); save({v:S.v,players:clean,games:S.games},"Склад збережено","Оновлено склад гравців"); break;
  }
});
app.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.open){e.preventDefault();e.target.click();}
  if(e.key==="Escape"&&(ui.form||ui.login||ui.pedit)){ui.form=null;ui.login=null;ui.pedit=null;render();}
});
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="e-num"&&ui.pedit){var w=document.getElementById("e-numwarn");if(w)w.textContent=numWarn(ui.pedit.id,t.value.trim());}
  if(t.dataset.pname!=null&&ui.players)ui.players[+t.dataset.pname].name=t.value;
});
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.pact!=null&&ui.players){ui.players[+t.dataset.pact].active=t.checked;render();}
  if(t.name==="s-rmode"){var sc=document.getElementById("s-sched");if(sc)sc.setAttribute("data-mode",t.value);}
});
function saveForm(){
  readForm(); var f=ui.form;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)){toast("Вкажіть дату гри");return;}
  var hasY=f.sy!=="", hasB=f.sb!=="";
  if(hasY!==hasB){toast("Вкажіть рахунок обох команд або залиште обидва поля порожніми");return;}
  if(hasY&&(+f.sy<0||+f.sb<0||isNaN(+f.sy)||isNaN(+f.sb))){toast("Рахунок має бути невідʼємним числом");return;}
  var y=[],b=[],c=[]; Object.keys(f.a).forEach(function(id){if(f.a[id]==="y")y.push(id);else if(f.a[id]==="b")b.push(id);else if(f.a[id]==="c")c.push(id);});
  if(!y.length&&!b.length&&!c.length&&!f.gy&&!f.gb){toast("Відмітьте хоча б одного гравця");return;}
  if(hasY&&c.length){toast("У «Буде» ще "+c.length+": "+c.map(function(id){return pname(id)==="?"?(f.extra.filter(function(p){return p.id===id;})[0]||{}).name:pname(id);}).join(", ")+". Розкидайте по командах перед рахунком");return;}
  var used=y.concat(b,c), players=S.players.concat(f.extra.filter(function(p){return used.indexOf(p.id)>=0;}));
  var games=S.games.filter(function(x){return x.id!==f.id;});
  var id=f.id||("g"+f.date.replace(/-/g,"")); while(!f.id&&games.some(function(x){return x.id===id;}))id+="b";
  /* не губити поля гри, яких форма не знає (paid, ann, x…) */
  var old=f.id&&S.games.filter(function(x){return x.id===f.id;})[0], g={};
  if(old)Object.keys(old).forEach(function(k){g[k]=old[k];});
  g.id=id; g.date=f.date; g.y=y; g.b=b; g.gy=f.gy; g.gb=f.gb;
  if(c.length)g.c=c; else delete g.c;
  if(hasY){g.sy=+f.sy;g.sb=+f.sb;delete g.x;} else {delete g.sy;delete g.sb;}
  if(old&&old.paid){var team=y.concat(b), kp=old.paid.filter(function(id){return team.indexOf(id)>=0;}); if(kp.length)g.paid=kp; else delete g.paid;}
  games.push(g); games=sortedGames(games);
  if(hasY||ui.tab==="matches")ui.season=f.date.slice(0,4);
  save({v:S.v,players:players,games:games},hasY?"Гру збережено":"Гру збережено без рахунку","Гра "+f.date+(hasY?" "+g.sy+":"+g.sb:" (без рахунку)"));
}

/* ---------- boot ---------- */
(function boot(){
  var c=cfgGet();
  route();
  var done=function(d){S=d; loaded=true; render(); loadTG();};
  setInterval(function(){if(loaded&&wxGame())loadWX(true);},30*60e3);
  var fail=function(){ui.loadError=location.protocol==="file:"?"Сторінка відкрита як файл з компʼютера. Відкрийте її за посиланням GitHub Pages, тоді підтягнуться дані.":"Не вдалося завантажити data.json. Перевірте, що файл лежить поруч з index.html.";render();};
  render();
  if(c.token&&c.owner&&c.repo){
    loadEditor(c).then(function(d){editor=true;done(d);}).catch(function(e){
      if(e.status===401){cfgSet(null);toast("Токен більше не діє. Увійдіть заново");}
      loadPublic().then(done).catch(fail);
    });
  } else loadPublic().then(done).catch(fail);
})();
})();

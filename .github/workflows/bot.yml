# Telegram-бот «Пʼятниця 5×5»: подяки за оплату й нагадування боржникам.
# Запускається: після кожного збереження data.json, кожні 15 хв (нові підключення до бота й нагадування за розкладом)
# і вручну з сайту (кнопки «Нагадати»). Токен бота — у секреті TG_TOKEN.
name: Telegram-бот

on:
  push:
    paths: [data.json]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — звичайний запуск, remind — нагадати зараз"
        default: auto
        required: false
      player:
        description: "id гравця для нагадування (порожньо — усім боржникам)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: tg-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Запуск бота
        run: node bot/bot.mjs
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          MODE: ${{ inputs.mode || 'auto' }}
          PLAYER: ${{ inputs.player || '' }}

      - name: Зберегти стан бота (tg.json)
        run: |
          if [ -n "$(git status --porcelain tg.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tg.json
            git commit -q -m "Бот: оновлено tg.json"
            for i in 1 2 3; do
              git pull -q --rebase && git push -q && exit 0
              sleep 5
            done
            exit 1
          fi
